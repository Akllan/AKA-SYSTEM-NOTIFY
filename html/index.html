<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aka-hud</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video class="hud-gif" autoplay loop muted playsinline src="https://cdn.discordapp.com/attachments/972633915292536862/1530118997717024768/Untitled_-_23_de_julio_de_2026_a_las_1614561-Picsart-BackgroundRemover1.webm?ex=6a6469dd&is=6a63185d&hm=c1e9d13139b8864c71c42e1de2c1ed28a22a037ecb837988e8c681cfb93cc095&"></video>
    <div id="hud-container">
        <!-- Barras superiores: Comida y Sed (mitad y mitad) -->
        <div class="status-row">
            <div class="status-box food-box">
                <svg class="status-icon" viewBox="0 0 24 24" width="12" height="12">
                    <path d="M8.1 13.34l2.83-2.83L3.91 3.5a4.008 4.008 0 000 5.66l4.19 4.18zm6.78-1.81c1.53.71 3.68.21 5.27-1.38 1.91-1.91 2.28-4.65.81-6.12-1.46-1.46-4.2-1.1-6.12.81-1.59 1.59-2.09 3.74-1.38 5.27L3.7 19.87l1.41 1.41L12 14.41l6.88 6.88 1.41-1.41L13.41 13l1.47-1.47z"/>
                </svg>
                <div class="status-bar">
                    <div class="status-fill food-fill" id="food-fill"></div>
                </div>
                <span class="status-text" id="food-text">100</span>
            </div>
            <div class="status-box thirst-box">
                <svg class="status-icon" viewBox="0 0 24 24" width="12" height="12">
                    <path d="M12 2c-5.33 4.55-8 8.48-8 11.8 0 4.98 3.8 8.2 8 8.2s8-3.22 8-8.2c0-3.32-2.67-7.25-8-11.8zm0 18c-3.35 0-6-2.57-6-6.2 0-2.34 1.95-5.44 6-9.14 4.05 3.7 6 6.79 6 9.14 0 3.63-2.65 6.2-6 6.2z"/>
                </svg>
                <div class="status-bar">
                    <div class="status-fill thirst-fill" id="thirst-fill"></div>
                </div>
                <span class="status-text" id="thirst-text">100</span>
            </div>
        </div>
        <!-- Barra principal: Vida -->
        <div class="health-box">
            <svg class="heart-icon" viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <div class="health-bar">
                <div class="health-fill" id="health-fill"></div>
            </div>
            <span class="health-text" id="health-text">100</span>
        </div>
        <!-- Barra de armadura -->
        <div class="armour-row" id="armour-row">
            <div class="armour-box" id="armour-box">
                <svg class="armour-icon" viewBox="0 0 24 24" width="14" height="14">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                </svg>
                <div class="armour-bar">
                    <div class="armour-fill" id="armour-fill"></div>
                </div>
                <span class="armour-text" id="armour-text">100</span>
            </div>
        </div>
        <!-- Datos del vehículo (todo dentro del mismo glassmorphism) -->
        <div class="vehicle-section" id="vehicle-section">
            <div class="v-speed-box">
                <div class="v-row-top">
                    <span class="v-speed" id="v-speed">0</span>
                    <span class="v-unit" id="v-unit">KM/H</span>
                    <span class="v-gear-badge" id="v-gear">N</span>
                    <svg class="v-seatbelt-icon" id="v-seatbelt" viewBox="0 0 24 24" width="10" height="10">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 2c4.42 0 8 3.58 8 8 0 1.57-.45 3.03-1.23 4.26L7.74 5.23C8.97 4.45 10.43 4 12 4zm0 16c-4.42 0-8-3.58-8-8 0-1.57.45-3.03 1.23-4.26l11.03 11.03C15.03 19.55 13.57 20 12 20z"/>
                    </svg>
                </div>
                <div class="v-rpm-bar">
                    <div class="v-rpm-fill" id="v-rpm-fill"></div>
                </div>
                <div class="v-row-fuel">
                    <svg class="v-fuel-icon" viewBox="0 0 24 24" width="10" height="10">
                        <path d="M3 2l2.01 18.23C5.13 21.23 5.97 22 7 22h10c1.03 0 1.87-.77 1.99-1.77L21 2H3zm9 17c-1.66 0-3-1.34-3-3 0-1.66 1.34-3 3-3s3 1.34 3 3c0 1.66-1.34 3-3 3zm6.5-6H5.5l.28-2.5h12.44l.28 2.5z"/>
                    </svg>
                    <div class="v-fuel-track">
                        <div class="v-fuel-fill" id="v-fuel-fill"></div>
                    </div>
                    <span class="v-fuel-text" id="v-fuel-value">100%</span>
                </div>
                <div class="v-row-nitro" id="v-row-nitro">
                    <svg class="v-nitro-icon" viewBox="0 0 24 24" width="10" height="10">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/>
                    </svg>
                    <div class="v-nitro-track">
                        <div class="v-nitro-fill" id="v-nitro-fill"></div>
                    </div>
                    <span class="v-nitro-text">NOS</span>
                </div>
            </div>
        </div>
    </div>
    <!-- Info boxes (top-right) -->
    <div class="info-wrap" id="info-wrap">
        <div class="info-row" id="info-row-id">
            <div class="info-box info-box-id">
                <svg class="info-icon" viewBox="0 0 24 24" width="10" height="10">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <span class="info-value" id="info-id-value">0</span>
            </div>
        </div>
        <div class="info-row">
            <div class="info-box" id="info-job">
                <svg class="info-icon" viewBox="0 0 24 24" width="10" height="10">
                    <path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/>
                </svg>
                <span class="info-value" id="info-job-value">Civilian</span>
            </div>
            <div class="info-box" id="info-grade">
                <svg class="info-icon" viewBox="0 0 24 24" width="10" height="10">
                    <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                </svg>
                <span class="info-value" id="info-grade-value">-</span>
            </div>
        </div>
        <div class="info-row">
            <div class="info-box" id="info-cash">
                <svg class="info-icon" viewBox="0 0 24 24" width="10" height="10">
                    <path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/>
                </svg>
                <span class="info-value" id="info-cash-value">$0</span>
            </div>
            <div class="info-box" id="info-bank">
                <svg class="info-icon" viewBox="0 0 24 24" width="10" height="10">
                    <path d="M4 10h3v7H4zm6.5 0h3v7h-3zM2 19h20v3H2zm15-9h3v7h-3zM2 5l10-4 10 4v3H2V5z"/>
                </svg>
                <span class="info-value" id="info-bank-value">$0</span>
            </div>
        </div>
    </div>
    <!-- Señal de voz centrada abajo (pma-voice) -->
    <svg class="mic-overlay" id="mic-overlay" viewBox="0 0 24 24" width="28" height="28">
        <path d="M12 13c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-4c-3.31 0-6 2.69-6 6h2c0-2.21 1.79-4 4-4s4 1.79 4 4h2c0-3.31-2.69-6-6-6zm0-4c-5.52 0-10 4.48-10 10h2c0-4.42 3.58-8 8-8s8 3.58 8 8h2c0-5.52-4.48-10-10-10z"/>
    </svg>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
